# cargo-deny: `just deny` (also run by the manual CI workflow).

[advisories]
# Same exception as .cargo/audit.toml (rsa is only used to encrypt with the
# server's public key, the Marvin attack does not apply). Re-check on sqlx bumps.
ignore = [
    "RUSTSEC-2023-0071",
    # Temporary (2026-11-16), re-check on every sqlx / SurrealDB bump:
    # SQLite reading uninitialized page cache through a crafted db + `-wal` pair (local
    # attacker, victim opens the files). sqlx 0.9 caps libsqlite3-sys at 0.37; the fix is 0.39.
    "RUSTSEC-2026-0459",
    # bincode unmaintained (no known vulnerability), via surrealmx: embedded SurrealDB
    # engine only (opt-in `surrealdb-mem`).
    "RUSTSEC-2025-0141",
    # crypto-bigint timing variability, via elliptic-curve 0.13 / jsonwebtoken inside the
    # SurrealDB engine (opt-in `surrealdb` features); elliptic-curve 0.13 cannot take 0.7.6.
    "RUSTSEC-2026-0387",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

# ─── SurrealDB (opt-in `surrealdb` features only) ─────────────────────────────
# The SurrealDB 4 SDK is BUSL-1.1 (additional use grant: not "as a Database Service").
# It is never in a default build: only `rango-orm/surrealdb`, `rango-orm-cli/surrealdb`
# and `rango-tests/integration-surrealdb` pull it in. Its crates ship the license as a
# file, so it is clarified here (hash = crc32 of that LICENSE), then allowed per crate.
# Re-check the hashes on every SurrealDB bump.

[[licenses.clarify]]
crate = "surrealdb"
expression = "BUSL-1.1"
license-files = [{ path = "LICENSE", hash = 0x0c3624e1 }]

