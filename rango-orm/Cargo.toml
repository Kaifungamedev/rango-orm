[package]
name = "rango-orm"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Django-inspired async ORM for Rust: define structs, get generated migrations and a typed query builder (PostgreSQL, SQLite, MySQL/MariaDB, SurrealDB)"
keywords = ["orm", "database", "sql", "async", "migrations"]
categories = ["database", "asynchronous"]
readme = "../README.md"

[lib]
name = "rango"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["postgres"]
postgres = ["dep:rango-orm-postgres"]
sqlite = ["dep:rango-orm-sqlite"]
mysql = ["dep:rango-orm-mysql"]
# SurrealDB 4 (remote servers over ws/http). Links the BUSL-1.1 SurrealDB SDK: opt-in.
surrealdb = ["dep:rango-orm-surrealdb", "rango-orm-surrealdb/protocol-ws", "rango-orm-surrealdb/protocol-http"]
# `surrealdb` plus the embedded in-memory engine (`surrealdb+mem://`).
surrealdb-mem = ["surrealdb", "rango-orm-surrealdb/kv-mem"]

[dependencies]
rango-orm-core     = { workspace = true }
rango-orm-derive   = { workspace = true }
rango-orm-postgres = { workspace = true, optional = true }
rango-orm-sqlite   = { workspace = true, optional = true }
rango-orm-mysql    = { workspace = true, optional = true }
rango-orm-surrealdb = { workspace = true, optional = true }

[dev-dependencies]
# Standard tool for testing compiler diagnostics (derive error messages).
trybuild = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
